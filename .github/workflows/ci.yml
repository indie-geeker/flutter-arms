name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: tool/gen.sh

      - name: Check generated files are committed
        run: |
          git diff --exit-code
          test -z "$(git status --short --untracked-files=all)"

      - name: Check formatting
        run: tool/format.sh

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Android dev debug
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
